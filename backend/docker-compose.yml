services:
  mysql:
    image: mysql:8.4
    container_name: retirement-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: retirement
      MYSQL_ROOT_PASSWORD: dev_pw
    # Host 3307 keeps this independent of any other local MySQL on 3306
    # (e.g. AgriServer's). Container port stays the standard 3306.
    ports:
      - "3307:3306"
    volumes:
      - retirement_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdev_pw"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  retirement_mysql_data:
