services:
  mysql:
    image: mysql:8.4
    container_name: retirement-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: retirement
      # Set MYSQL_ROOT_PASSWORD in backend/.env (copy from .env.example). Never commit it.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in backend/.env}
    # Host 3307 keeps this independent of any other local MySQL on 3306
    # (e.g. AgriServer's). Container port stays the standard 3306.
    ports:
      - "3307:3306"
    volumes:
      - retirement_mysql_data:/var/lib/mysql
    healthcheck:
      # $$ escapes to $ so the container expands its own env var — the password
      # value never appears in this file.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  retirement_mysql_data:
